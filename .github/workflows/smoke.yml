name: smoke

# End-to-end check on every OS, proving the no-download path: build the
# per-platform packages (binary bundled), pack cli + mcp + this runner's
# platform package, install them, then scan + run the MCP handshake. The
# install pulls no binary from the network - @leakferret/cli resolves the
# bundled binary out of the platform package.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  install-and-scan:
    name: platform-package install + scan + mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the per-platform packages (bundles the binary)
        run: node scripts/build-platform-packages.js

      - name: Pack + install (cli + mcp + this platform), scan, MCP handshake
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          case "$RUNNER_OS" in
            Linux)   platdir=cli-linux-x64 ;;
            macOS)   if [ "$(uname -m)" = "arm64" ]; then platdir=cli-darwin-arm64; else platdir=cli-darwin-x64; fi ;;
            Windows) platdir=cli-win32-x64 ;;
          esac

          ( cd packages/cli  && npm pack ) >/dev/null
          ( cd packages/mcp  && npm pack ) >/dev/null
          ( cd "dist/$platdir" && npm pack ) >/dev/null
          cli="$(ls -1 "$root"/packages/cli/*.tgz | head -1)"
          mcp="$(ls -1 "$root"/packages/mcp/*.tgz | head -1)"
          plat="$(ls -1 "$root/dist/$platdir"/*.tgz | head -1)"

          work="${RUNNER_TEMP:-/tmp}/lf-smoke"
          mkdir -p "$work" && cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$cli" "$mcp" "$plat"

          # scan: must resolve the bundled binary (no download) and find the secret
          printf "AWS_ACCESS_KEY = 'AKIAQ7W2E3R4T5Y6U7I8'\n" > config.rb
          out="$(node node_modules/@leakferret/cli/bin/leakferret.js scan . || true)"
          echo "$out"
          echo "$out" | grep -q 'aws_access_key' || { echo "::error::cli did not detect the planted secret"; exit 1; }

          # mcp handshake (mcp -> cli -> bundled binary)
          resp="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | node node_modules/@leakferret/mcp/bin/leakferret-mcp.js)"
          echo "$resp"
          echo "$resp" | grep -q '"serverInfo"' || { echo "::error::mcp handshake failed"; exit 1; }
