name: smoke

# Real install + scan + MCP handshake on every OS. `npm install` runs the
# cli postinstall, which downloads the published release binary — so this
# only passes once leakferrethq/leakferret v0.1.0 is public.
on:
  workflow_dispatch:
  # Uncomment after the release is published:
  # push:
  # pull_request:

jobs:
  install-and-scan:
    name: npm install + scan + mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install workspace (cli postinstall downloads the release binary)
        run: npm install
      - name: Scan via the CLI
        shell: bash
        run: |
          mkdir -p app
          printf "AWS_ACCESS_KEY = 'AKIAQ7W2E3R4T5Y6U7I8'\n" > app/config.rb
          out="$(node packages/cli/bin/leakferret.js scan . || true)"
          echo "$out"
          echo "$out" | grep -q 'aws_access_key' || { echo "::error::cli did not detect the planted secret"; exit 1; }
      - name: MCP initialize handshake
        shell: bash
        run: |
          resp="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | node packages/mcp/bin/leakferret-mcp.js)"
          echo "$resp"
          echo "$resp" | grep -q '"serverInfo"' || { echo "::error::mcp handshake failed"; exit 1; }
